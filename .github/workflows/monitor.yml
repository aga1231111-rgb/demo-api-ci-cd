name: Production Monitor

on:
  schedule:
    - cron: '0 * * * *' # Chạy tự động mỗi 1 giờ
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub Actions

jobs:
  monitor-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Đăng nhập Postman
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Chạy kịch bản Monitor trực tiếp từ Cloud
        run: |
          postman collection run "34104301-5ea66b53-dd9b-47ef-840c-45823c2df9ce"
